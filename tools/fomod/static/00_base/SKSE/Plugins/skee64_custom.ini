; Magic Tattoos Framework — minimal SKEE override.
;
; SKEE (RaceMenu / NiOverride) reads skee64.ini, then applies skee64_custom.ini
; on top per-section, so this file only needs the ONE key MTF changes. Every
; other RaceMenu setting (and any the user customized) is left untouched.
;
; Why this exists: RaceMenu defaults bPlayerOnly=1, which restricts overlays to
; the player. MTF's "Apply tattoo" spell / preset-on-NPC feature draws overlays
; on tracked NPCs too, which silently no-ops unless this is 0.
;
; Using skee64_custom.ini (not a full skee64.ini copy) avoids the loose-file
; conflict with RaceMenu's own ini and is load-order independent.

[Overlays]
bPlayerOnly=0 ; Default[1] — let MTF apply tattoos to tracked NPCs, not just the player
