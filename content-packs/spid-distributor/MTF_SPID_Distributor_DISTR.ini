; MTF SPID NPC preset distribution (optional addon). REQUIRES Spell Perk Item
; Distributor (SPID, po3_SpellPerkItemDistributor.dll).
;
; This distributes the "MTF Distribute" carrier ability (MagicTattoosFramework
; 0x927) to NPCs. On apply, the ability asks MTF to evaluate the rules in
; SKSE/Plugins/StorageUtilData/MagicTattoosFramework/distribution/*.json for
; that actor, applies the chosen preset, then self-deletes. ALL targeting and
; preset selection lives in the distribution JSON, NOT here — this line only
; decides which NPCs MTF even considers (a coarse gate).
;
; Format: Spell = FormOrEditorID|StringFilters|FormFilters|LevelFilters|Traits|Count|Chance
;
; The sample below gates to Lydia (NPC_ 0x000A2C94) to match sample.json.
; - To let MTF's JSON filter ALL NPCs, replace the FormFilter with NONE:
;     Spell = 0x927~MagicTattoosFramework.esp
; - Or set your own SPID filters (keywords/factions/races/level/traits).
Spell = 0x927~MagicTattoosFramework.esp|NONE|0x000A2C94~Skyrim.esm|NONE|NONE|NONE|100
