# Deploy tools/web-pack-builder/ to GitHub Pages.
#
# Live URL: https://levchimik.github.io/magic-tattoos-framework/
#
# Triggered on:
#   - push to main, if the web tool or this workflow itself changed
#   - manual run from the Actions tab (workflow_dispatch)
#
# Concurrency guards against overlapping deploys clobbering each other.

name: Deploy web pack builder to Pages

on:
  push:
    branches: [main]
    paths:
      - 'tools/web-pack-builder/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Pages deployments need these permissions on the GITHUB_TOKEN.
permissions:
  contents: read
  pages: write
  id-token: write

# Cancel any in-flight deploy if a new push lands. Don't cancel a run
# that's already publishing — that would leave Pages in a half-state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact (tools/web-pack-builder)
        uses: actions/upload-pages-artifact@v3
        with:
          path: tools/web-pack-builder

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
