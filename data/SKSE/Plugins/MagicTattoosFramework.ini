; Magic Tattoos Framework — runtime config.
;
; Read by MTFPulse.dll on SKSE kPostLoad via Win32 GetPrivateProfileInt.
; Edits take effect on Skyrim restart.
;
; Bethesda convention: type-prefixed keys.
;   i = int    (iFoo)
;   f = float  (fFoo)
;   b = bool   (bFoo)
;   s = string (sFoo)

[General]

; Storage cap — how many effect bindings each condition slot can hold.
; Read by BOTH MTFPulse.dll (C++ roster) and MTF_MainQuest.psc
; (MAX_EFFECTS_PER_SLOT) so they stay in lockstep. The MCM editor still
; only surfaces the first 8 rows (MAX_EFFECTS_PER_SLOT_MCM); bindings
; beyond that dispatch normally and clearing a visible row promotes a
; hidden one into view. Valid range [1, 99]; values outside that fall
; back to the hardcoded default of 32.
;
; Bumping triggers EnsureArrays' migration path on next load — existing
; saves are re-indexed s*OLD+e → s*NEW+e, no data loss. Lowering is
; destructive (bindings beyond the new cap silently drop).
iMaxEffectsPerSlot = 32

; Backend cap — how many condition slots evaluateTier scans (1..N).
; Slot 0 is the always-on Default and isn't part of this count. MCM still
; renders 7 rows regardless; backend-only slots (8..N) are reachable via
; JSON preset import, SkyrimNet automation, or direct SetCondPluginId
; calls. Visual customization is inherited from Default for backend slots
; (per-slot pack/entry/layer Auto arrays stay MCM-cap sized).
; Valid range [1, 256]; values outside fall back to the hardcoded 32.
iMaxConditions = 32
