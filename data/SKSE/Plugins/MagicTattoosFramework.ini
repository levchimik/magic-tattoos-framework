; Magic Tattoos Framework — runtime config.
;
; Read by MTFPulse.dll on SKSE kPostLoad via Win32 GetPrivateProfileInt.
; Edits take effect on Skyrim restart.
;
; Bethesda convention: type-prefixed keys.
;   i = int    (iFoo)
;   f = float  (fFoo)
;   b = bool   (bFoo)
;   s = string (sFoo)

[General]

; Storage cap — how many effect bindings each condition slot can hold.
; The MCM editor still only surfaces the first 4 rows; bindings beyond
; that dispatch normally and clearing a visible row promotes a hidden
; one into view. Valid range [1, 99]; values outside that fall back to
; the hardcoded default of 20.
;
; Bumping triggers EnsureArrays' migration path on next load — existing
; saves are re-indexed s*OLD+e → s*NEW+e, no data loss.
iMaxEffectsPerSlot = 20
